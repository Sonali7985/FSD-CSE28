<!DOCTYPE html>
<html>
<head>
<title>Student Registration form </title>
<style>
body{
font-family: Arial, sans-serif;
background: linear-gradient (to right,#74eb5,#9face6);
display : flex;
justify-contebt : center;
align -items: center;
height :100vh;
}
.container{
background : white;
padding : 30px;
boder-raius: 5px;
width: 350px;
box-shadow:0px, 0px,10px rgba(0,0,0,0.2);
}
h2{
text-align:center;
margin-bottom : 20px;
}
input:focus{
border-color: #6a5acd;
outline :none;
}
button{
width:100;
padding:10px;
background-color:#6a5acd;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}
button:hover{
background-color:#483d8b;
}
</style>
</head>

<body> 
<div class="container">
    <h2>Student Registration Form</h2> 
    <!-- Form with method and action attributes --> 
    <form method="post" action="Submit.php"> 
         
        <label for="fullname">Full Name:</label> 
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" 
required> 
      
        <label for="email">Email Address:</label> 
        <input type="email" id="email" name="email" placeholder="example@domain.com" 
required> 
       
        <label for="phone">Phone Number:</label> 
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" 
required> 
        <!-- Gender (Select dropdown) -->
  <select id="gender" name="gender" required> 
            <option value="">-- Select Gender --</option> 
            <option value="male">Male</option> 
            <option value="female">Female</option> 
            <option value="other">Other</option> 
        </select> 
        <!-- Course Applied For --> 
        <label for="course">Course Applied For:</label> 
        <select id="course" name="course" required> 
            <option value="">-- Select Course --</option> 
            <option value="btech">B.Tech</option> 
            <option value="bca">BCA</option> 
            <option value="bsc">B.Sc</option> 
            <option value="mba">MBA</option> 
        </select> 
        
        
  <div class="inline"> 
            <div> 
                <label for="dob">Date of Birth:</label> 
                <input type="date" id="dob" name="dob" required> 
            </div> 
            <div> 
 
                <label for="rollno">Roll Number:</label> 
                <input type="text" id="rollno" name="rollno" placeholder="e.g., CS2025A45" 
required> 
            </div> 
        </div> 
        <!-- Buttons --> 
        <div class="inline"> 
            <button type="submit" class="submit-btn">Submit</button> 
            <button type="reset" class="reset-btn">Reset</button>
            
        </div> 
    </form> 
</body> 
</html>
